[project]
name = "mlflow-prefect-test"
version = "0.1.0"
description = "Local Prefect ProcessWorker demo integrating DataLad and MLflow"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "albumentations>=1.4,<3",
  "datalad>=1.1,<2",
  "matplotlib>=3.8,<4",
  "mlflow>=3,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "prefect>=3,<4",
  "scikit-learn>=1.4,<2",
  "seaborn>=0.13,<1",
  "tensorboard>=2.16,<3",
  "timm>=1,<2",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
